name: repair_ai
description: "AI-powered mobile repair assistant for technicians"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Backend
  supabase_flutter: ^2.10.0
  
  # Local Storage
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  
  # Networking
  http: ^1.3.0
  
  # Secure Storage (API keys)
  flutter_secure_storage: ^9.2.4
  
  # Images
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  
  # Navigation
  go_router: ^14.8.1
  
  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  file_picker: ^8.1.7
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  
  # Localization
  flutter_localizations:
    sdk: flutter
  
  # JSON
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  
  # Markdown (for solutions)
  flutter_markdown: ^0.7.7
  
  # HTML rendering
  flutter_html: ^3.0.0-beta.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.23.1
  riverpod_generator: ^2.6.4
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/images/
    - assets/icons/
