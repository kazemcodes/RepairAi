name: Update Index

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'
  pull_request:
    paths:
      - 'data/**'

jobs:
  update-index:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install pyyaml
          
      - name: Scan data directory
        id: scan
        run: |
          python .github/scripts/scan_data.py
          
      - name: Update index.json
        run: |
          python .github/scripts/generate_index.py
          
      - name: Commit changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.json
          git diff --staged --quiet || git commit -m "chore: Update index.json"
          
      - name: Create Pull Request
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: Update index.json'
          title: 'Update index.json'
          body: 'Automated update of index.json'
          branch: 'update-index'
